description: MommaZoo was a mobile web application for parent-teacher and school-community communication,
  surfaced as a portfolio company of 500 Global and added to the API Evangelist network as a stub for
  enrichment. Built as an HTML5 cross-platform app, it let parents and teachers centralize class posts,
  homework, sign-ups, reminders, documents, and multi-channel messaging across devices and languages.
  The company is defunct - public activity ends around 2013 and the mommazoo.com domain is now parked -
  and an enrichment pass found no developer portal, documentation, or public API surface.
